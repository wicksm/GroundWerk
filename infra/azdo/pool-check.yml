# pool-check runs one job on groundwerk-pool to prove the pool works (CICD-15). Run it by hand
# from Pipelines. With no agent on standby, the job waits a few minutes while Azure makes one.
trigger: none

pool:
  name: groundwerk-pool

jobs:
  - job: check
    displayName: Run on the pool
    timeoutInMinutes: 10
    steps:
      - checkout: none

      - bash: |
          set -euo pipefail
          echo "Agent $(Agent.Name) on $(Agent.MachineName)"
          grep PRETTY_NAME /etc/os-release
          nproc
        displayName: Show where the job ran
