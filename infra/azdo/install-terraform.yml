# Installs one pinned Terraform, checked against HashiCorp's published checksums
parameters:
  - name: version
    type: string
    default: 1.17.1

steps:
  - bash: |
      set -euo pipefail
      v='${{ parameters.version }}'
      cd "$(Agent.TempDirectory)"
      curl -fsSLO "https://releases.hashicorp.com/terraform/${v}/terraform_${v}_linux_amd64.zip"
      curl -fsSLO "https://releases.hashicorp.com/terraform/${v}/terraform_${v}_SHA256SUMS"
      grep " terraform_${v}_linux_amd64.zip\$" "terraform_${v}_SHA256SUMS" | sha256sum -c -
      mkdir -p "$(Agent.ToolsDirectory)/terraform/${v}"
      unzip -o -q "terraform_${v}_linux_amd64.zip" -d "$(Agent.ToolsDirectory)/terraform/${v}"
      echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/terraform/${v}"
    displayName: Install Terraform ${{ parameters.version }}Í