# Pipeline build-groundwerk: GroundWerk's ci stage, from the template in
# GroundWerk.PipelineTemplates at a release tag (CICD-1, CICD-3). It runs on each change to main,
# and as main's PR build through the branch policy in infra/azdo/policies.tf, for any change
# outside docs and Markdown files (CICD-10, docs/adr/0008).
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs
      - '**/*.md'

resources:
  repositories:
    - repository: templates
      type: git
      name: GroundWerk.PipelineTemplates
      ref: refs/tags/v1.3.1
    # This environment's names, which infra/azdo/settings.tf writes (docs/adr/0012)
    - repository: settings
      type: git
      name: Settings

variables:
  - template: variables.yml@settings

extends:
  template: stages/ci.yml@templates
  parameters:
    # The dev container's image, as pipeline build-image pushed it
    image: ${{ variables.registry }}/build-image@sha256:a0121079b79cd4ae8c4027d84d5bfe588c54dae56ece14bb200a1e0dddd274f7
    registryConnection: registry-pull
    sonarConnection: sonarqube-cloud
    sonarOrganization: mikewicks-lab
    sonarProjectKey: ${{ variables.sonarProjectKey }}
    # GroundWerk is the project's name in SonarQube Cloud. Left out of coverage: the AppHost, which
    # only starts the apps on a dev machine, so no test runs it, and tools, whose code build.cs
    # doesn't test
    sonarProperties: |
      sonar.projectName=GroundWerk
      sonar.coverage.exclusions=**/GroundWerk.AppHost/**,tools/**
